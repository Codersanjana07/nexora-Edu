<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Project</title>
    <style>
        body {
            width: 320px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
        }
        .badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            background-color: #4f46e5;
            font-weight: 600;
        }
        .timer-box {
            text-align: center;
            padding: 20px;
            background-color: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        #timer {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #f43f5e;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        #startBtn {
            background-color: #4f46e5;
            color: white;
            font-size: 14px;
        }
        .ai-section {
            background-color: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        textarea {
            width: 93%;
            height: 50px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 4px;
            color: white;
            padding: 8px;
            resize: none;
            font-family: inherit;
        }
        #aiBtn {
            background-color: #0ea5e9;
            color: white;
        }
        .box {
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.4;
            display: none;
        }
        #aiResponseBox {
            background-color: #0369a1;
            border-left: 4px solid #38bdf8;
        }
        #rewardBox {
            background-color: #15803d;
            border-left: 4px solid #4ade80;
            text-align: center;
        }
        #blockAlert {
            background-color: #991b1b;
            border-left: 4px solid #f43f5e;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">Nexora Workspace</div>
            <div id="modeBadge" class="badge">Normal Mode</div>
        </div>

        <div class="timer-box">
            <div id="timer">05:00</div>
        </div>

        <button id="startBtn">Start Focus Mode</button>

        <div id="blockAlert" class="box">Distraction Blocked! Stay Focused.</div>
        <div id="rewardBox" class="box">🎉 Session Completed! Enjoy your break.</div>

        <div class="ai-section">
            <div style="font-size: 13px; font-weight: 600; color: #94a3b8;">Distracted? Dump your thoughts here:</div>
            <textarea id="noteInput" placeholder="E.g., I want to check Instagram..."></textarea>
            <button id="aiBtn">Analyze with Nexora AI</button>
            <div id="aiResponseBox" class="box">
                <div id="aiResponse"></div>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
