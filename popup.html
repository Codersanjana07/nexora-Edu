<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
    <style>
     body { 
        width: 340px;
        font-family:"Segoe UI", Arial, sans-serif;
        background-color: lch(9.83% 67.86 305.8);
        color: beige;
        margin: 0px;
        padding: 18px;
     }
      .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #374151;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

      .title{color: #818cf8; font-size:18px; font-weight: bold;margin: 0; }
      .badge {
        background-color: rgb(225, 224, 221);
        color: azure;
        font-size:11px;
        margin: 2px 8px;
        border-radius: 12px;
        border: 1px solid #4f46e5;
      }
      .card {
         background-color: #1f2937;
         border: 1px solid #374151;
         border-radius: 12px;
         padding: 16px;
         margin-bottom: 16px;
         text-align: center;
      }
      .card-title { font-size: 12px;color: #9ca3af; margin: 0 0 8px 0;letter-spacing: 0.05;}
      .font-display { font-size: 14px; font-weight: 800; color: #ffffff; margin: 0; }
.btn {

         width: 100%;
         background-color: #4f46e5;
         color: white;
         border: none;
         padding: 12px;
         border-radius: 8px;
         font-weight: bold;
         cursor: pointer;
         font-size: 14px;
      }
      .btn-ai {background-color: #059669;margin: 0;}
       .textarea {
      width: 93%;
      background-color: #111827;
      border: 1px solid #374151;
      color: white;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      resize: none;
      outline: none;
    }
    .response-box {
      margin-top: 12px;
      padding: 12px;
      background-color: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      font-size: 12px;
      text-align: left;
      display: none;
    }
    .response-title { color: #34d399; font-weight: bold; display: block; margin-bottom: 4px; }
    .footer { text-align: center; font-size: 10px; color: #6b7280; margin-top: 16px; }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="title">⚡ NexoraMind AI</h1>
    <span class="badge">Solo Mode</span>
  </div>

  <div class="card">
    <p class="card-title">⏱️ FOCUS SESSION</p>
    <div id="timer" class="timer-display">25:00</div>
    <button id="startBtn" class="btn">Start Focus</button>
  </div>

  <div class="card" style="text-align: left;">
    <p class="card-title">🧠 AI QUICK THOUGHT CAPTURE</p>
    <textarea id="noteInput" rows="3" class="textarea" placeholder="Type your distracted thought here..."></textarea>
    <button id="aiBtn" class="btn btn-ai">🚀 Process with Gemini AI</button>
    
    <div id="aiResponseBox" class="response-box">
      <span class="response-title">AI Insights:</span>
      <p id="aiResponse" style="margin: 0;"></p>
    </div>
  </div>

  <div class="footer">NEXORA 2026 • Digital Well-being Assistant</div>

  <script src="popup.js"></script>
</body>
</html>
